[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingestion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "kafka-python>=2.2.15",
    "llama-index-workflows>=2.8.0",
    "pycryptodome>=3.23.0",
    "qdrant-client>=1.15.1",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/ingestion"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project.scripts]
ingest-images = "ingestion.workflow.main:main"
