name: CI Tests - Image Embedding

on:
  pull_request:

jobs:
  testing-image-embedding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Run Tests
        working-directory: image-embedding
        run: uv run -- pytest tests/
