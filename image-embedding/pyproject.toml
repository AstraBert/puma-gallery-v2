[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-embedding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kafka-python>=2.2.15",
    "llama-index-workflows>=2.8.0",
    "pycryptodome>=3.23.0",
    "replicate>=1.0.7",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/image_embedding"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project.scripts]
embed-images = "image_embedding.workflow.main:main"
