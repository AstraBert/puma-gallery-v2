[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-embedding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "kafka-python>=2.2.15",
    "llama-index-workflows>=2.8.0",
    "pillow>=11.3.0",
    "requests>=2.32.5",
    "torch>=2.8.0",
    "transformers>=4.57.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/image_embeddings"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project.scripts]
embed-images = "image_embeddings.workflow.main:main"